[package]
name = "layoutsmith"
description = "Visual editor for Android layout XML files"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
layoutsmith-core = { path = "../layoutsmith-core" }
eframe = { version = "=0.36.2", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
rfd = "0.17.2"

# Windows and macOS render with wgpu: Direct3D 12 on Windows (which also works
# on virtual machines and Remote Desktop through the WARP software renderer)
# and Metal on macOS. On Windows glow stays available as a fallback and can be
# forced with LAYOUTSMITH_RENDERER=glow.
[target.'cfg(any(windows, target_os = "macos"))'.dependencies]
eframe = { version = "=0.36.2", default-features = false, features = ["wgpu"] }
