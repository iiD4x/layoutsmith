name: Release

# Publishes the Windows build with a release. Either push a version tag:
#   git tag v0.1.0 && git push origin v0.1.0
# or publish a release on GitHub (Releases > Draft a new release, new tag v0.1.0);
# the files are then added to that release.
on:
  push:
    tags: ['v*']
  release:
    types: [published]

permissions:
  contents: write

# A release made on the website can also fire the tag push; run one at a time
# (re-uploads overwrite the same files).
concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Keep the write token off disk while dependencies' build scripts run.
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --workspace --locked
      - run: cargo build --release --locked -p layoutsmith
      - name: Package
        shell: pwsh
        env:
          TAG: ${{ github.ref_name }}
        run: |
          $name = "layoutsmith-$env:TAG-windows-x86_64"
          New-Item -ItemType Directory -Path "dist/$name" -Force | Out-Null
          Copy-Item -Path target/release/layoutsmith.exe, README.md, LICENSE -Destination "dist/$name/"
          Copy-Item -Path samples -Destination "dist/$name/samples" -Recurse
          Compress-Archive -Path "dist/$name" -DestinationPath "dist/$name.zip"
          Copy-Item -Path target/release/layoutsmith.exe -Destination "dist/$name.exe"
          # LF line endings, so both sha256sum -c and macOS shasum -c accept it.
          $sums = Get-FileHash "dist/$name.zip", "dist/$name.exe" -Algorithm SHA256 |
            ForEach-Object { "{0}  {1}" -f $_.Hash.ToLower(), (Split-Path $_.Path -Leaf) }
          [IO.File]::WriteAllText("$PWD/dist/SHA256SUMS.txt", ($sums -join "`n") + "`n")
      - uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/*.zip
            dist/*.exe
            dist/SHA256SUMS.txt
          fail_on_unmatched_files: true
          # Keep notes written on the website; generate them for tag pushes.
          generate_release_notes: ${{ github.event_name == 'push' }}
